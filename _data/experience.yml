      dates: "Jun 2026 - Present"
      summary: "Leading an industrial case study of Filozof, an LLM-based requirement elicitation system developed and deployed by Fibabanka."
      bullets:
        - "Designed a mixed-method evaluation that studies the system in terms of requirement quality, time and effort, the requirement preparation process and user perception through expert ratings, an LLM judge, workflow data, surveys and interviews."

