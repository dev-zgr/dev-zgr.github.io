- group: "Research Experience"
  entries:
    - title: "Graduate Researcher"
      org: "BILSEN Research Group, Bilkent University"
      url: "https://bilsen.cs.bilkent.edu.tr"
      location: "Ankara, Turkey"
      dates: "Jun 2025 - Present"
      summary: >-
        Empirical software engineering research on AI-assisted code review and LLM-based software engineering tools
        under the supervision of
        [Dr. Eray Tuzun](https://scholar.google.com/citations?hl=en&user=D4jovncAAAAJ&view_op=list_works&sortby=pubdate)
        (undergraduate researcher until June 2026).
      bullets:
        - "Leading the group's industry collaborations with Turkish Airlines and Fibabanka and designing industrial case studies that empirically evaluate LLM-based tools for code review, GUI testing and requirement elicitation."
        - "Wrote the funded TUBITAK 1005 proposal (126E749) of Dr. Tuzun's project on an AI-supported code review platform that builds on our vision paper on the future of code review."
        - "Worked on fine-tuning LLMs to classify pull request-issue alignment, agent skills for agentic code review, localizing tangled lines with LLMs, an industrial case study of a custom code analysis tool and the vision paper."
        - "Mentoring a senior design project team in the department and three undergraduate researchers who work with me on agent skills for code review, tangled line localization and GUI bug detection."
        - "Reviewing submissions to ICSE 2025, ICSE 2026, FSE 2026 and ESEM 2026 as a sub-reviewer with Dr. Tuzun and reviewing group members' papers before submission."

    - title: "Undergraduate Researcher"
      org: "ANLAM-NET Research Lab, Ankara University"
      url: "https://anlamnet.ankara.edu.tr/en/mainpage/"
      location: "Ankara, Turkey"
      dates: "Sep 2024 - Jun 2026"
      summary: >-
        Natural language processing research under the supervision of
        [Dr. Murat Karakus](https://scholar.google.com/citations?hl=en&user=fGkZEUsAAAAJ&view_op=list_works&sortby=pubdate).
      bullets:
        - "Co-authored a paper on fine-tuning Turkish LLMs for sentiment and topic analysis of airport reviews (IEEE Access)."
        - "Took part in writing the funded TUBITAK 1005 (125E350) and Ankara University BAP (FLO-2025-3966) proposals for LLM-based feedback analysis systems."
        - "Worked on the resulting voice-based feedback analysis project."

    - title: "Undergraduate Researcher"
      org: "CRADLE Lab, University of Michigan-Flint"
      url: "https://cradlelab.us"
      location: "Remote"
      dates: "Sep 2023 - Dec 2025"
      summary: >-
        Research on software-defined networking (SDN) and blockchain under the supervision of
        [Dr. Suleyman Uludag](https://scholar.google.com/citations?user=GOzfj9sAAAAJ&hl=en) through regular remote meetings.
      bullets:
        - "Co-authored a journal article on a smart parking system built on SDN and blockchain (JNCA)."
        - "Formulated parking assignment as a fairness-driven integer optimization problem that is equivalent to parallel job scheduling (NP-hard) and evaluated heuristic solvers for it (local search, branch-and-bound and genetic search)."

