biography_title: "Biography"

biography:
  - >-
    My name is Hüseyin Özgür Kamalı and currently I am a first year M.Sc. student in Computer Science at
    [Bilkent University](https://w3.cs.bilkent.edu.tr/en/) under the supervision of
    [Dr. Eray Tüzün](https://scholar.google.com/citations?user=D4jovncAAAAJ&hl=en) in the
    [BILSEN](https://bilsen.cs.bilkent.edu.tr) research group. Before that, I graduated 2<sup>nd</sup> in my class
    with a GPA of 3.71 from the Software Engineering program at Ankara University in June 2026.
  - >-
    I have been doing research for more than three years and over these years I worked with three research groups
    in computer networks, NLP and software engineering. My first research experience was at the
    [CRADLE Lab](https://cradlelab.us) of [Dr. Süleyman Uludağ](https://scholar.google.com/citations?user=GOzfj9sAAAAJ&hl=en)
    at the University of Michigan Flint and I worked remotely on a smart parking system built on SDN and blockchain.
    At the end of my second year I also joined the [ANLAM-NET](https://anlamnet.ankara.edu.tr/en/mainpage/) NLP lab
    at Ankara University with [Dr. Murat Karakuş](https://scholar.google.com/citations?user=fGkZEUsAAAAJ&hl=en)
    and worked on fine-tuning small open-source LLMs for Turkish feedback analysis.
  - >-
    I joined BILSEN in June 2025 while I was still an undergraduate. At BILSEN I first worked on classifying
    pull request (PR)-issue alignment with fine-tuned LLMs and then wrote a vision paper with Dr. Tüzün about an
    agentic code review system that lets agents do the analysis and humans keep the control points. Currently, I lead
    BILSEN's industrial case studies with Turkish Airlines and Fibabanka and I mentor undergraduate researchers
    working on agent skills for code review, tangled line localization and GUI bug detection with multi-agent systems.

