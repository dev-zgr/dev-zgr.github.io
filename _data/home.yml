research_title: "Research"

research:
  - >-
    My research is in the intersection of Software Engineering and AI. I am mainly interested in how LLMs and
    coding agents change software engineering processes like code review and how we can evaluate these tools
    empirically, both on open-source data and in industry with real developers.
  - >-
    Currently I am working on the following topics.

