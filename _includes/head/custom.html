{% include base_path %}

<!-- start custom head snippets -->

<!-- theme_toggle: false in _config.yml keeps the site in the light theme -->
<script>window.SITE_THEME_TOGGLE = {{ site.theme_toggle | default: false | jsonify }};</script>

<!-- Support for jQuery, this needs to be first so that it has a chance to load. -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- favicon: Bilkent University emblem (images/favicon-*.png). The ?v= query
     changes on every build so browsers (Safari) drop a cached old icon. -->
{% capture icon_version %}{{ site.time | date: '%s' }}{% endcapture %}
<link rel="icon" href="{{ base_path }}/images/favicon.ico?v={{ icon_version }}" sizes="any"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v={{ icon_version }}" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png?v={{ icon_version }}" sizes="192x192"/>
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v={{ icon_version }}"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json?v={{ icon_version }}"/>
<meta name="theme-color" content="#ffffff"/>

<!-- end custom head snippets -->
